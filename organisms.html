<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <title>invertiaDB</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" type="img/x-icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script crossorigin='anonymous' src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script crossorigin='anonymous' src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>
    <script src="js/functions.js"></script>
    <script src="js/components.js"></script>

    <style>
        body {
            font-family: monospace;
        }

        .accession-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
        }

        .accession-div {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            display: none;
            /* Hide loader by default */
        }

        .dt-empty {
            display: none;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        #dataTablesButtonsContainer {
            margin-top: 2%;
            margin-left: 2%;
            margin-right: 2%;
        }

        #organisms-table {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .table-wrapper {
            overflow: overlay;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>
    <br>

    <div class="main-container">
        <div class="accession-div">
            <div class="loader" id="loader"></div>
            <br>
            <br>
        </div>

        <br>
        <div id="example_wrapper" class="dt-container dt-bootstrap5"
            style="margin-right: 80px; margin-left: 80px; margin-bottom: 36px;">
            <br>

            <div class="input-group">
                <input type="search" class="form-control rounded" id="search-input"
                    placeholder="Quick Search on Organism Name" aria-label="Search" aria-describedby="search-addon" />
                <button type="button" class="btn btn-outline-primary" id="search-button">Search</button>
            </div>

            <div class="row mt-2 justify-content-md-center">
                <div class="table-wrapper col-12 ">
                    <table id="organisms-table" class="display table table-striped table-hover dataTable"
                        style="table-layout: auto; width: 100%;" aria-describedby="example_info">
                        <thead>
                            <tr role="row" id="tandem-table-header"></tr>
                        </thead>
                        <tbody id="tandem-table-body">
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="row mt-2 justify-content-between">
                <div id="paginationControls" class="d-flex justify-content-center"></div>
            </div>
        </div>
        <div id="footer-container"></div>
    </div>

    <script>
        let currentPage = 1;
        const pageSize = 10;
        let organism_data;
        let organism_columns;
        let organisms_table;

        function fetchDataAndPopulateOrganismsTable() {
            const offset = (currentPage - 1) * pageSize;
            $("#loader").show();

            $.ajax({
                url: `${backend_url}/hairpin/statistics/organisms?n=${pageSize}&offset=${offset}`,
                method: 'GET',
                success: function (data) {
                    organism_data = data.data;
                    organism_columns = data.columns;
                    const totalRecords = data.total;
                    const totalPages = Math.ceil(totalRecords / pageSize);

                    createGetDataIndexByName(organism_columns, "data");

                    // Render table with the fetched data
                    renderTable(organism_data, organism_columns);

                    // Update pagination controls
                    updatePaginationControls(totalPages);
                    $("#loader").hide();
                },
                error: function (jqXHR, textStatus, errorThrown) {
                    console.error('Error:', textStatus, errorThrown);
                    $("#loader").hide();
                }
            });
        }

        function renderTable(data, columns) {
            if (organisms_table) {
                organisms_table.destroy();
            }

            organisms_table = new DataTable('#organisms-table', {
                data: processOrganismalData(data, data_index_by_name),
                columns: columns.map((col) => ({
                    title: capitalizeFirstLetterOfEachWord(col),
                    visible: true
                })),
                paging: false,
                searching: true,
            });
        }

        function updatePaginationControls(totalPages) {
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.innerText = 'Previous';
            prevButton.disabled = currentPage === 1;
            prevButton.className = 'btn btn-secondary';
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchDataAndPopulateOrganismsTable();
                }
            });
            paginationContainer.appendChild(prevButton);

            const pageInfo = document.createElement('span');
            pageInfo.innerText = ` Page ${currentPage} of ${totalPages} `;
            pageInfo.style.margin = '0 10px';
            paginationContainer.appendChild(pageInfo);

            const nextButton = document.createElement('button');
            nextButton.innerText = 'Next';
            nextButton.disabled = currentPage === totalPages;
            nextButton.className = 'btn btn-secondary';
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchDataAndPopulateOrganismsTable();
                }
            });
            paginationContainer.appendChild(nextButton);
        }

        function quickSearchDatabase(search_term) {
            $("#loader").show();
            if (!search_term || search_term === '') {
                fetchDataAndPopulateOrganismsTable();
                return

            }
            const post_data = { value: search_term };

            $.ajax({
                url: `${backend_url}/hairpin/organisms/quick_search`,
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(post_data),
                success: function (data) {
                    organism_data = data;
                    currentPage = 1;
                    renderTable(organism_data, organism_columns);
                    updatePaginationControls(1); // Only one page for quick search
                    $("#loader").hide();
                },
                error: function (xhr, status, error) {
                    $("#loader").hide();
                    console.error('Error:', error);
                }
            });
        }

        $(document).ready(function () {
            $('#search-input').on('keydown', function (event) {
                if (event.key === 'Enter') {
                    const search_term = $('#search-input').val();
                    quickSearchDatabase(search_term);
                }
            });

            $('#search-button').on('click', function () {
                const search_term = $('#search-input').val();
                quickSearchDatabase(search_term);
            });

            fetchDataAndPopulateOrganismsTable();
        });

    </script>
</body>

</html>
