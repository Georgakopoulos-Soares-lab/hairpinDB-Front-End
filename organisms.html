<!DOCTYPE html>
<html data-bs-theme="light">

<head>
    <title>invertiaDB</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <link rel="icon" type="img/x-icon" href="/img/favicon.ico">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.datatables.net/2.0.8/css/dataTables.bootstrap5.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
    <script crossorigin='anonymous' src="https://cdn.datatables.net/2.0.8/js/dataTables.js"></script>
    <script crossorigin='anonymous' src="https://cdn.datatables.net/2.0.8/js/dataTables.bootstrap5.js"></script>

    <!-- Your custom JS files -->
    <script src="js/functions.js"></script>
    <script src="js/components.js"></script>

    <style>
        body {
            font-family: monospace;
        }

        .accession-header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 10px;
        }

        .accession-div {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loader {
            border: 16px solid #f3f3f3;
            border-top: 16px solid #3498db;
            border-radius: 50%;
            width: 120px;
            height: 120px;
            animation: spin 2s linear infinite;
            display: none; /* Hide loader by default */
        }

        .dt-empty {
            display: none;
        }

        table.dataTable thead th,
        table.dataTable thead td,
        table.dataTable tfoot th,
        table.dataTable tfoot td {
            text-align: center !important;
        }

        table.dataTable td.dt-type-numeric,
        table.dataTable td.dt-type-date {
            text-align: center !important;
        }

        th.dt-type-numeric {
            text-align: center !important;
        }

        .sorting_1 {
            display: flex;
            justify-content: center;
            text-align: center !important;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        #dataTablesButtonsContainer {
            margin-top: 2%;
            margin-left: 2%;
            margin-right: 2%;
        }

        #organisms-table {
            box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
        }

        .table-wrapper {
            overflow: overlay;
        }

        #column-selection {
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
        }

        .button-secondary {
            background-color: #f0f0f0; /* Light gray */
            color: #333; /* Dark text */
            border: 1px solid #ccc; /* Subtle border */
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 14px;
            font-weight: bold;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .dropdown-content {
            display: none;
            position: absolute;
            background-color: #f9f9f9;
            min-width: 160px;
            box-shadow: 0px 8px 16px 0px rgba(0, 0, 0, 0.2);
            z-index: 1;
            padding: 10px;
            overflow: auto;
            max-height: 300px; /* You can adjust this */
        }

        .dropdown:hover .dropdown-content {
            display: block;
        }

        .dropdown label {
            display: block;
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div id="navbar-container"></div>
    <br>

    <div class="main-container">
        <div class="accession-div">
            <div class="loader" id="loader"></div>
            <br><br>
        </div>

        <br>
        <div id="example_wrapper" class="dt-container dt-bootstrap5"
            style="margin-right: 80px; margin-left: 80px; margin-bottom: 36px;">
            <br>

            <!-- Quick Search UI -->
            <div class="input-group">
                <input type="search" class="form-control rounded" id="search-input"
                    placeholder="Quick Search on Organism Name" aria-label="Search" aria-describedby="search-addon" />
                <button type="button" class="btn btn-outline-primary" id="search-button">Search</button>
            </div>

            <!-- Column Visibility Dropdown -->
            <div class="dropdown my-4">
                <button class="dropdown-btn btn button-secondary" id="column-selection">Column Visibility ↓</button>
                <div class="dropdown-content" id="dropdown-content"></div>
            </div>

            <div class="row mt-2 justify-content-md-center">
                <div class="table-wrapper col-12">
                    <table id="organisms-table" class="display table table-striped table-hover dataTable"
                        style="table-layout: auto; width: 100%;" aria-describedby="example_info">
                        <thead>
                            <tr role="row" id="tandem-table-header"></tr>
                        </thead>
                        <tbody id="tandem-table-body"></tbody>
                    </table>
                </div>
            </div>

            <div class="row mt-2 justify-content-between">
                <div id="paginationControls" class="d-flex justify-content-center"></div>
            </div>
        </div>
        <div id="footer-container"></div>
    </div>

    <script>
        // -------------
        // GLOBAL STATE
        // -------------
        let selectedEntries = 25;      // number of records per page
        let currentPage = 1;           // current page index
        let searchValue = "";          // search term (if any)

        let organism_data;
        let organism_data_all;
        let organism_columns;
        let organisms_table;
        let data_index_by_name = {};

        // Required columns that are visible by default
        const requiredColumns = [
            "organism_name",
            "domain",
            "assembly_count",
            "avg_inverted_repeat_count",
            "stddev_inverted_repeat_count",
            "min_inverted_repeat_count",
            "max_inverted_repeat_count",
            "avg_length_sequences",
            "stddev_length_sequences",
            "min_length_sequences",
            "max_length_sequences",
            "avg_genome_size"
        ];

        // -------------
        // ON DOM READY
        // -------------
        $(document).ready(function () {
            // Initial load (no search)
            fetchDataAndPopulateOrganismsTable();

            // Search button
            $("#search-button").on("click", function () {
                searchValue = $("#search-input").val().trim();
                currentPage = 1; // reset to first page
                fetchDataAndPopulateOrganismsTable();
            });

            // Enter key in search box
            $("#search-input").on("keypress", function (e) {
                if (e.which == 13) {
                    $("#search-button").click();
                }
            });

            // Show/hide column dropdown
            $('#column-selection').on('click', function (event) {
                event.stopPropagation();
                $('#dropdown-content').toggle();
            });
            $('#dropdown-content').on('click', function (event) {
                event.stopPropagation();
            });
            $(document).on('click', function () {
                $('#dropdown-content').hide();
            });

            // Toggle column visibility from dropdown
            $('#dropdown-content').on('change', 'input[type="checkbox"]', function () {
                const columnIdx = $(this).data('column-index');
                const column = organisms_table.column(columnIdx);
                column.visible(!column.visible());
            });
        });

        // -------------------------
        // FUNCTION: fetch + render
        // -------------------------
        function fetchDataAndPopulateOrganismsTable() {
            const offset = (currentPage - 1) * selectedEntries;
            $("#loader").show();

            // If we have a search term, go to the quick search route
            if (searchValue) {
                $.ajax({
                    url: `${backend_url}/hairpin/organisms/quick_search`,
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({
                        value: searchValue,
                        n: selectedEntries,
                        offset: offset
                    }),
                    success: function (data) {
                        handleAjaxData(data);
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        console.error('Quick Search Error:', textStatus, errorThrown);
                        $("#loader").hide();
                    }
                });
            } else {
                // Otherwise, the normal route
                $.ajax({
                    url: `${backend_url}/hairpin/statistics/organisms?n=${selectedEntries}&offset=${offset}`,
                    method: 'GET',
                    success: function (data) {
                        organism_data_all=data.data;
                        handleAjaxData(data);
                    },
                    error: function (jqXHR, textStatus, errorThrown) {
                        console.error('Error:', textStatus, errorThrown);
                        $("#loader").hide();
                    }
                });
            }
        }

        // ---------------------------
        // FUNCTION: handleAjaxData
        // ---------------------------
        function handleAjaxData(data) {
            const [filteredHeaders, filteredData, columnMetaData] = filterResponse({
                columns: data.columns,
                data: data.data
            });

            organism_columns = filteredHeaders;
            organism_data = filteredData;

            // Rebuild the column->index map
            createGetDataIndexByName(organism_columns);

            // Now apply all transformations, including your button
            const finalRows = processOrganismalData(organism_data, data_index_by_name);

            // Render DataTable
            renderTable(finalRows, columnMetaData);

            // Pagination info
            updatePaginationControls(Math.ceil(data.total / selectedEntries));

            $("#loader").hide();
        }

        // ---------------------------
        // FUNCTION: filterResponse
        // Keep only required columns visible by default
        // ---------------------------
        function filterResponse(response) {
            const headers = response.columns;
            const data = response.data;

            // Mark columns visible if in requiredColumns
            const selectedIndexes = headers.map((col, index) => ({
                name: col,
                index: index,
                visible: requiredColumns.includes(col)
            }));

            const filteredHeaders = selectedIndexes.map(item => item.name);
            const filteredData = data.map(row => {
                return selectedIndexes.map(item => row[item.index]);
            });

            return [filteredHeaders, filteredData, selectedIndexes];
        }

        // -----------------------------------
        // FUNCTION: renderTable (DataTables)
        // -----------------------------------
        function renderTable(finalRows, columnMetaData) {
            if (organisms_table) {
                organisms_table.destroy();
            }

            organisms_table = new DataTable('#organisms-table', {
                data: finalRows,
                columns: columnMetaData.map(col => ({
                    title: capitalizeFirstLetterOfEachWord(col.name),
                    visible: col.visible
                })),
                searching: false,
                paging: false,
                pageLength: selectedEntries,
                lengthMenu: [
                    [10, 25, 50, 100],
                    [10, 25, 50, 100]
                ]
            });

            populateColumnDropdown(columnMetaData);

            // If user changes page length from DataTables dropdown
            organisms_table.on('length.dt', function (e, settings, len) {
                selectedEntries = len;
                currentPage = 1;
                fetchDataAndPopulateOrganismsTable();
            });
        }

        // -----------------------------------------
        // FUNCTION: populateColumnDropdown
        // Builds the checkboxes for each column
        // -----------------------------------------
        function populateColumnDropdown(columnMetaData) {
            const dropdownContent = $('#dropdown-content');
            dropdownContent.empty();

            columnMetaData.forEach((col, index) => {
                const isChecked = organisms_table.column(index).visible();
                const checkbox = `
                  <label>
                      <input type="checkbox" data-column-index="${index}" 
                             ${isChecked ? 'checked' : ''}>
                      ${capitalizeFirstLetterOfEachWord(col.name)}
                  </label><br>
                `;
                dropdownContent.append(checkbox);
            });
        }

        // -----------------------------------------
        // FUNCTION: updatePaginationControls
        // -----------------------------------------
        function updatePaginationControls(totalPages) {
            const paginationContainer = document.getElementById('paginationControls');
            paginationContainer.innerHTML = '';

            const prevButton = document.createElement('button');
            prevButton.innerText = 'Previous';
            prevButton.disabled = currentPage === 1;
            prevButton.className = 'btn btn-primary';
            prevButton.addEventListener('click', () => {
                if (currentPage > 1) {
                    currentPage--;
                    fetchDataAndPopulateOrganismsTable();
                }
            });
            paginationContainer.appendChild(prevButton);

            const pageInfo = document.createElement('span');
            pageInfo.innerText = ` Page ${currentPage} of ${totalPages} `;
            pageInfo.style.margin = '0 10px';
            paginationContainer.appendChild(pageInfo);

            const nextButton = document.createElement('button');
            nextButton.innerText = 'Next';
            nextButton.disabled = currentPage === totalPages;
            nextButton.className = 'btn btn-primary';
            nextButton.addEventListener('click', () => {
                if (currentPage < totalPages) {
                    currentPage++;
                    fetchDataAndPopulateOrganismsTable();
                }
            });
            paginationContainer.appendChild(nextButton);
        }

        // ------------------------------------------------
        // FUNCTION: createGetDataIndexByName
        // Builds a map { columnName -> 0-based index }
        // ------------------------------------------------
        function createGetDataIndexByName(columns) {
            data_index_by_name = {};
            for (let i = 0; i < columns.length; i++) {
                data_index_by_name[columns[i]] = i;
            }
        }

        // ------------------------------------------------
        // FUNCTION: processOrganismalData
        // Restores your button logic & numeric rounding
        // ------------------------------------------------
        function processOrganismalData(data, idx) {
            let processed = [];
            for (const d of data) {
                let row = [...d];

                for (let i = 0; i < row.length; i++) {
                    const value = row[i];

                    // Check if numeric
                    if (!isNaN(value) && value !== null && value !== '') {
                        if (Number.isInteger(parseFloat(value))) {
                            // leave integers as-is
                            row[i] = value;
                        } else {
                            // if it's in certain columns, use denistyToMegabasePairs
                            // (function must exist in your code)
                            if ([30, 31, 32, 33, 34, 35, 36].includes(i)) {
                                row[i] = denistyToMegabasePairs(value);
                            } else {
                                row[i] = parseFloat(value).toFixed(2);
                            }
                        }
                    }

                    // If this is the 'organism_name' column, create the button
                    if (i === idx["organism_name"]) {
                        let buttonHtml = `
                          <button class='btn btn-outline-primary gotoviz-btn'
                                  onclick="goToOrganism('${btoa(value)}')">
                            <em>${value}</em>
                          </button>`;
                        row[i] = buttonHtml;
                    }
                }
                processed.push(row);
            }
            return processed;
        }


      
    </script>
</body>
</html>
