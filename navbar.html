<style>
    /* General Navbar Styling */
    .navbar {
        background-color: #ffffff;
        /* Light background */
        font-family: 'Arial', sans-serif;
        /* Clean font for a professional look */
        padding: 10px 20px;
        box-shadow: 0px 2px 5px rgba(0, 0, 0, 0.1);
        /* Subtle shadow for depth */
    }

    .navbar-brand {
        font-weight: bold;
        font-size: 1.2rem;
        color: #343a40 !important;
    }

    .nav-link {
        font-size: 0.95rem;
        padding: 8px 12px;
        color: #555555 !important;
        transition: color 0.3s ease, background-color 0.3s ease;
    }

    .nav-link:hover {
        color: #000000 !important;
        background-color: #eaeaea !important;
        /* Subtle gray hover effect */
        border-radius: 5px;
        /* Rounded edges */
    }

    /* Dropdown Menu Styling */
    .dropdown-menu {
        background-color: #ffffff;
        /* White dropdown background */
        border: 1px solid #e2e2e2;
        /* Border for structure */
        border-radius: 5px;
        /* Rounded corners */
        box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.1);
        /* Subtle shadow */
        padding: 10px 0;
        /* Space around items */
        animation: fadeIn 0.3s ease;
        /* Smooth fade-in animation */
    }

    .dropdown-item {
        font-size: 0.9rem;
        padding: 8px 15px;
        color: #555555 !important;
        transition: color 0.3s ease, background-color 0.3s ease;
    }

    .dropdown-item:hover {
        color: #000000 !important;
        background-color: #f5f5f5 !important;
        /* Slightly lighter gray hover */
    }

    /* Add subtle hover effect for dropdown items */
    .dropdown-item::before {
        content: "›";
        /* Arrow or custom symbol */
        display: inline-block;
        margin-right: 10px;
        opacity: 0;
        transform: translateX(-10px);
        transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .dropdown-item:hover::before {
        opacity: 1;
        transform: translateX(0);
    }

    /* Dropdown animation */
    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(-10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    /* Dropdown toggle arrow styling */
    .dropdown-toggle::after {
        display: inline-block;
        margin-left: 5px;
        vertical-align: middle;
        content: '';
        border-top: 5px solid #555555;
        /* Arrow color */
        border-right: 5px solid transparent;
        border-left: 5px solid transparent;
        transition: transform 0.3s ease;
    }

    .dropdown-toggle[aria-expanded="true"]::after {
        transform: rotate(180deg);
        /* Flip arrow when open */
    }
</style>
